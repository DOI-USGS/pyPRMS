[build-system]
requires = ["setuptools>=61"]   # , "setuptools-scm", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "pyPRMS"
description = "Python library for Precipitation-Runoff Modeling System"
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.10,<3.15"
license = "CC0-1.0"
license-files = ["LICENSE.md"]
authors = [{ name = "U.S. Geological Survey" },]
maintainers = [{name = "Parker Norton", email = "pnorton@usgs.gov"}, ]
keywords = ["PRMS", "NHM", "streamflow", "hydrology", "surface water"]
classifiers = ["Development Status :: 4 - Beta",
               "Intended Audience :: Science/Research",
               "Operating System :: OS Independent",
               "Programming Language :: Python :: 3",
               "Programming Language :: Python :: 3 :: Only",
               "Programming Language :: Python :: 3.10",
               "Programming Language :: Python :: 3.11",
               "Programming Language :: Python :: 3.12",
               "Programming Language :: Python :: 3.13",
               "Programming Language :: Python :: 3.14",]

dependencies = ["cartopy",
    "dask",
    "fsspec",
    "geopandas",
    "matplotlib",
    "netCDF4!=1.7.4",
    "networkx>=2",
    "numpy",
    "packaging",
    "pandas",
    "pyproj",
    "rich",
    "shapely",
    "xarray",
    "zarr"]

[project.optional-dependencies]
dev = ["mypy",
       "mypy_extensions",
       "pandas-stubs",
       "pytest",
       "pytest-cov",
       "pytest-xdist",
       "pytest-datafiles",
       "coverage[toml]",
       "sphinx",
       "sphinx-autodoc-typehints",
       "sphinx-book-theme",]

[project.urls]
Repository = "https://github.com/DOI-USGS/pyPRMS.git"

[project.scripts]
convert_params = "pyPRMS.utilities.convert_params:main"
convert_cbh = "pyPRMS.utilities.convert_cbh:main"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov=pyPRMS --cov-report=term-missing --cov-report=xml:coverage.xml"
testpaths = ["tests"]

[tool.coverage.run]
source = ["pyPRMS"]
branch = true
omit = ["*/src/netCDF4/_netCDF4.pyx", ]

[tool.coverage.report]
omit = ["*/src/netCDF4/_netCDF4.pyx", ]
show_missing = true
skip_covered = false
precision = 1

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.dynamic]
version = {attr = "pyPRMS.version.__version__"}

[tool.setuptools.packages.find]
include = ["pyPRMS", "pyPRMS.*"]

[tool.setuptools.package-data]
"pyPRMS.xml" = ["*.xml"]
